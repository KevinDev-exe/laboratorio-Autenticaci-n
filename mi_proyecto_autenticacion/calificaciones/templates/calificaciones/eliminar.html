<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eliminar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-4 text-center" style="width: 400px;">
    
    <h3 class="text-danger mb-3">⚠️ ¿Eliminar registro?</h3>

    <p class="text-muted">
        Esta acción no se puede deshacer.<br>
        ¿Seguro que deseas eliminar este registro?
    </p>

    <form method="post">
        {% csrf_token %}

        <button class="btn btn-danger w-100 mb-2">🗑️ Sí, eliminar</button>
        <a href="{% url 'listar' %}" class="btn btn-secondary w-100">Cancelar</a>
    </form>

</div>

</body>
</html>
