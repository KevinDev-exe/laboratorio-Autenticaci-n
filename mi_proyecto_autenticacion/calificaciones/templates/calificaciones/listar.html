<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
<h2>Calificaciones</h2>

<a href="{% url 'crear' %}" class="btn btn-success">Nueva</a>
<a href="{% url 'logout' %}" class="btn btn-danger">Salir</a>

<table class="table table-striped mt-3">
<tr>
<th>Nombre</th><th>Notas</th><th>Promedio</th><th>Acciones</th>
</tr>

{% for c in object_list %}
<tr>
<td>{{ c.nombre_estudiante }}</td>
<td>{{ c.nota1 }} | {{ c.nota2 }} | {{ c.nota3 }}</td>
<td>{{ c.promedio }}</td>
<td>
<a href="{% url 'editar' c.id %}" class="btn btn-warning">Editar</a>
<a href="{% url 'eliminar' c.id %}" class="btn btn-danger">Eliminar</a>
</td>
</tr>
{% endfor %}
</table>

<h4>Promedio General: {{ promedio_general }}</h4>
</div>
